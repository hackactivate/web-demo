<!DOCTYPE html>
<html>
<head>
    <title>Virtual Cockfight Simulator</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 10px 20px; font-size: 16px; margin: 10px; }
        #result { font-size: 20px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Virtual Cockfight Simulator</h1>
    <p>Click a button to see which cock wins!</p>
    <button onclick="fight('Red')">Red Cock</button>
    <button onclick="fight('Blue')">Blue Cock</button>
    <div id="result"></div>

    <script>
        function fight(selected) {
            const cocks = ['Red', 'Blue'];
            const winner = cocks[Math.floor(Math.random() * cocks.length)];
            if(selected === winner){
                document.getElementById('result').innerText = `You chose ${selected}. ${winner} wins! You guessed correctly!`;
            } else {
                document.getElementById('result').innerText = `You chose ${selected}. ${winner} wins! Better luck next time.`;
            }
        }
    </script>
</body>
</html>
